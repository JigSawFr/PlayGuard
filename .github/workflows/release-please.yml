name: release-please

# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date (CHANGELOG.md, version in CMakeLists.txt) from the
# conventional commits. Merging that PR creates the vX.Y.Z tag and the GitHub
# release; the build below then attaches the .nro / .zip to it. build.yml
# does not run on tags, hence the direct call.
on:
  push:
    branches: [ main ]
  # Re-run by hand, e.g. after editing a merged PR's release notes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.retry.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.retry.outputs.tag_name }}
    steps:
      # A token of the "PlayGuard Release" GitHub App, not GITHUB_TOKEN: the
      # app is on the tag ruleset's bypass list (GITHUB_TOKEN cannot create
      # the vX.Y.Z tag), and its pushes to the release PR trigger the other
      # workflows, so the required checks report on it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          # The app's client ID (or, until RELEASE_APP_CLIENT_ID is set, its app ID:
          # GitHub takes either as the JWT's issuer); "app-id" is deprecated.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # GitHub's GraphQL API now and then answers "Something went wrong while
      # executing your query" (2026-10-22, on f11c5fa): one more try a minute
      # later rather than a red main until the next push. release-please
      # reads its state from GitHub (the release pull request's label, the
      # releases made), so the second try starts from where the first stopped.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Wait before trying again
        if: steps.release.outcome == 'failure'
        run: sleep 60
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: retry
        if: steps.release.outcome == 'failure'
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A called workflow gets at most what its caller grants: the build's release job
    # needs these three to attach the assets and attest their provenance, and
    # discussions to open the release's discussion.
    permissions:
      contents: write
      id-token: write
      attestations: write
      discussions: write
      pull-requests: read
    uses: ./.github/workflows/build.yml
    # Only the secrets the build asks for (its workflow_call secrets), not
    # every secret of the repository: the Docker Hub login for the switch
    # job's image, and the release job's app key and release-page key.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
