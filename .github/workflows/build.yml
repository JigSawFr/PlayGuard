name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Weekly, on main: a runner image or Docker Hub change shows up here before
  # it fails a pull request (the visual check depends on the image's mesa).
  schedule:
    - cron: '17 5 * * 1'
  # Called by release-please.yml once a release (and its vX.Y.Z tag) exists.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the assets to
        type: string
        required: true
    # What release-please.yml passes, by name (no `secrets: inherit`). Each is
    # optional, as on a fork: the jobs go on without it.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

permissions:
  contents: read

# A new push to a pull request cancels the run on the commit it replaces. Everything else
# (main, a release build called by release-please.yml) gets a group of its own and is
# never cancelled or held back by another run.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The runner image is pinned (ubuntu-26.04, not ubuntu-latest): the visual check
# compares screenshots drawn by the image's mesa, so a new image can change
# every screen. Moving to the next one is a pull request of its own, with a look
# at the screenshots. Every job writes a summary on the run page
# (tools/ci_summary.py), and names its artifacts after the build (the `meta` job).

jobs:
  # What is being built: the version (CMakeLists.txt), the commit (a pull
  # request's head, as the artifacts API names the run), and a label for the
  # artifact names, `<version>-<ref>-<commit>`: 1.0.0-pr92-1f0a059,
  # 1.0.0-main-2bd4996, 1.0.0-release-2bd4996. Its summary heads the run page.
  meta:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      label: ${{ steps.label.outputs.label }}
      version: ${{ steps.label.outputs.version }}
      ref: ${{ steps.label.outputs.ref }}
      sha: ${{ steps.label.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: |
            CMakeLists.txt
            tools/ci_summary.py
            .github/workflows/build.yml
          sparse-checkout-cone-mode: false
      - name: Build label
        id: label
        env:
          TAG: ${{ inputs.tag }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^set(VERSION_\(MAJOR\|MINOR\|ALTER\) "\([0-9]*\)").*/\2/p' CMakeLists.txt | paste -sd.)
          if [ -n "$TAG" ]; then ref=release
          elif [ -n "$PR" ]; then ref="pr$PR"
          else ref=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._' '-' | tr -s '-' | cut -c1-40); fi
          sha7=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          { echo "version=$version"; echo "ref=$ref"; echo "sha=$HEAD_SHA"; echo "label=$version-$ref-$sha7"; } | tee -a "$GITHUB_OUTPUT"
      - name: Run summary
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message || inputs.tag }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          TAG: ${{ inputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 tools/ci_summary.py header --label "${{ steps.label.outputs.label }}" \
            --version "${{ steps.label.outputs.version }}" --sha "${{ steps.label.outputs.sha }}" \
            --branch "$BRANCH" --base "$BASE" --pr "$PR" --tag "$TAG" --title "${TITLE%%$'\n'*}" \
            --event "${{ github.event_name }}" --repo-url "$REPO_URL" --runner ubuntu-26.04 \
            --image "$(sed -n 's/^ *image: \(devkitpro\/devkita64@sha256:[0-9a-f]*\)$/\1/p' .github/workflows/build.yml)" \
            >> "$GITHUB_STEP_SUMMARY"

  # What a pull request changes, for the jobs it needs. Each output is true
  # unless every file changed is one that job does not read:
  # - `host`: the clang and coverage host tests: not for documentation (the
  #   `docs` pattern: the website, the web simulator's page, other
  #   workflows) nor for the desktop smoke test's own files (its scripts,
  #   tests/visual/, tests/cut_text/);
  # - `desktop`: the desktop build and its smoke test: not for documentation
  #   nor the host tests' suites (tests/ but tests/visual/, tests/cut_text/);
  # - `switch`: the Switch build: not for documentation, tests/, the
  #   simulator (source/sim/, not built for the Switch) nor the smoke test's
  #   scripts.
  # host-tests always runs (the resources, CONTRIBUTING.md and docs/config.md
  # checks). A skipped job counts as passed for the branch rules, and
  # desktop-smoke accepts its shards skipped. Every push, schedule, release
  # or run by hand, and a pull request whose files cannot be listed: all true.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      host: ${{ steps.files.outputs.host }}
      desktop: ${{ steps.files.outputs.desktop }}
      switch: ${{ steps.files.outputs.switch }}
    steps:
      - name: Files changed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          host=true desktop=true switch=true
          docs='^(docs|site|branding|images|web)/|^(README(\.fr)?|ROADMAP|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\.md$|^LICENSE$'
          docs="$docs"'|^\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/|^\.github/(CODEOWNERS|FUNDING\.yml|SUPPORT\.md|labels\.json|dependabot\.yml|pull_request_template\.md)$'
          docs="$docs"'|^\.github/workflows/(web|pages|codeql|labels|pr-title|release-page|release-please|toolchain-watch)\.yml$'
          docs="$docs"'|^tools/(build_site|check_site_links|web_[a-z_]+)\.py$|^tools/(site_screenshots|site_social|render_tour|render_branding)\.mjs$'
          smoke='^tests/(visual|cut_text)/|^tools/(desktop_smoke|cut_text_check|visual_check)\.py$'
          # needed <skip> [<but>]: true when a file is neither documentation
          # nor <skip>, or matches <but>.
          needed() {
            if grep -vE "$docs" <<< "$files" | grep -qvE "$1" || { [ -n "${2:-}" ] && grep -qE "$2" <<< "$files"; }; then
              echo true
            else
              echo false
            fi
          }
          # The API lists 3000 files at most: more, and some may be code.
          if [ -n "$PR" ] && files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') \
              && [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 3000 ]; then
            host=$(needed "$smoke")
            desktop=$(needed '^tests/' '^tests/(visual|cut_text)/')
            switch=$(needed "^tests/|^source/sim/|$smoke")
            echo "$(wc -l <<< "$files") files changed:"
            sed 's/^/  /' <<< "$files"
          fi
          { echo "host=$host"; echo "desktop=$desktop"; echo "switch=$switch"; } | tee -a "$GITHUB_OUTPUT"
          skipped=""
          [ "$host" = true ] || skipped="$skipped, the clang and coverage host tests"
          [ "$desktop" = true ] || skipped="$skipped, the desktop build and smoke test"
          [ "$switch" = true ] || skipped="$skipped, the Switch build"
          if [ -n "$skipped" ]; then
            echo "Not needed by what this pull request changes: ${skipped#, }." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Fast checks with no toolchain: C service layer unit tests (under
  # AddressSanitizer and UndefinedBehaviorSanitizer) + resources.
  host-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true   # nlohmann/json (bundled with borealis) for the backup and export tests
      # A compiler error or warning becomes an annotation on the file's line
      # (.github/problem-matchers/gcc.json). Not for extern/: borealis' own
      # warnings are not PlayGuard's, and would bury its annotations.
      - name: Compiler messages as annotations
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"
      - name: zlib headers (the playstats and dev_builds suites)
        run: dpkg -s zlib1g-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev; }
      - name: Unit tests (service layer — writable and read-only — and UI-free helpers)
        run: make test
      - name: Test summary
        if: always()
        run: python3 tools/ci_summary.py host-tests build/host-tests --compiler "gcc $(gcc -dumpfullversion)" --flags "ASan + UBSan" >> "$GITHUB_STEP_SUMMARY"
      - name: Resources (i18n keys, translations, XML layouts), the web simulator's settings and page logic, compat.json generator, Python tools
        run: |
          status=0
          # check <label> <command...>: runs it; its last line goes to the summary.
          check() {
            label=$1; shift
            if out=$("$@" 2>&1); then mark=✅; else mark=❌; status=1; fi
            printf '%s\n' "$out"
            last=$(printf '%s\n' "$out" | tail -n 1)
            echo "$mark **$label**${last:+ — $last}" >> "$GITHUB_STEP_SUMMARY"
          }
          check "Resources (i18n keys, translations, XML layouts)" python3 tools/check_resources.py .
          check "Remote link documents (Home Assistant discovery, state)" python3 tools/check_sync_json.py build/host-tests/sync
          check "Web simulator's settings (every PLAYGUARD_SIM_* variable)" python3 tools/check_web_params.py .
          check "Web simulator's page logic (web/sim_logic.js)" node --test tests/web_page/*.test.js
          check "compat.json generator" python3 tools/gen_compat.py . build/compat.json
          check "Python tools compile" python3 -m py_compile tools/*.py
          exit $status

  # The same host tests built by clang (other warnings, other sanitizer
  # runtime), then once more by gcc with --coverage for a line coverage
  # summary on the run page, with the last build of main as a baseline (the
  # coverage is a report, not a gate), then the fuzz targets (clang's
  # libFuzzer, tests/fuzz/).
  host-tests-clang-coverage:
    needs: [ changes ]
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Compiler messages as annotations
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"
      - name: Dependencies (clang's sanitizer runtime, gcovr, zlib headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev gcovr zlib1g-dev
      - name: Unit tests (clang)
        run: make test CC=clang CXX=clang++
      - name: Test summary (clang)
        if: always()
        run: python3 tools/ci_summary.py host-tests build/host-tests --compiler "clang $(clang -dumpversion)" --flags "ASan + UBSan" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests (gcc, coverage)
        # Without the sanitizers: their instrumentation skews the counts.
        run: make test SAN= COV=--coverage CC=gcc CXX=g++
      # The coverage of main's last build (a small JSON in the Actions cache,
      # written by the pushes to main below) for the "vs main" column.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: baseline-coverage
          key: baseline-coverage-main-${{ github.sha }}
          restore-keys: baseline-coverage-main-
      - name: Coverage summary
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gcovr --root . --filter 'source/' --txt-summary build/host-tests
          gcovr --root . --filter 'source/' --json-summary-pretty --json-summary build/coverage.json build/host-tests
          python3 tools/ci_summary.py coverage build/coverage.json --scope "host tests, gcc --coverage, source/" \
            --baseline baseline-coverage/coverage.json --write-baseline baseline-coverage/coverage.json --sha "$SHA" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.tag == ''
        with:
          path: baseline-coverage
          key: baseline-coverage-main-${{ github.sha }}
      # The parsers of outside data (archives, Markdown, the rescue report,
      # config.json, the caches) under libFuzzer, 30 s each from the seed
      # corpus in tests/fuzz/, in parallel, last: a crash fails the job once
      # the coverage is out. The input it stopped on is in the artifact below
      # (replay: build/fuzz/<target> <file>).
      - name: Fuzzing (libFuzzer, 30 s per target)
        if: always()
        run: make fuzz FUZZ_SECONDS=30
      - name: Fuzzing summary
        if: always()
        run: python3 tools/ci_summary.py fuzz build/fuzz --seconds 30 >> "$GITHUB_STEP_SUMMARY"
      - name: Inputs the fuzzers stopped on
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ github.run_id }}
          path: |
            build/fuzz/*-crash-*
            build/fuzz/*-leak-*
            build/fuzz/*-timeout-*
            build/fuzz/*-oom-*
            build/fuzz/*.log
          retention-days: 7
          if-no-files-found: ignore

  # Builds the UI on Linux against the simulated backend (once, with the
  # shared ccache), for the shards below: the program and its resources go
  # to them as a short-lived artifact (BRLS_RESOURCES_DIR is this build
  # folder, the same path on every runner).
  desktop-build:
    needs: [ changes ]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: Borealis GLFW fork
        run: git -C extern/borealis submodule update --init --depth 1 library/lib/extern/glfw
      - name: Compiler messages as annotations
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"
      # The packages below as downloaded by the last run (29 MB, 6 s to
      # fetch): apt takes them from there, and fetches only what moved since.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-archives
          key: apt-desktop-${{ github.sha }}
          restore-keys: apt-desktop-
      # Without the recommended packages (ImageMagick's ghostscript and fonts,
      # for one): man-db's index is not rebuilt (2 s of every install, for no
      # reader); autoclean drops the packages a newer version replaced. The
      # shards install the same list (the X and GL libraries, xvfb, xdotool…)
      # from this cache.
      - name: Dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          archives="-o Dir::Cache::Archives=$GITHUB_WORKSPACE/.apt-archives"
          mkdir -p .apt-archives/partial
          sudo apt-get update
          sudo apt-get install $archives -y --no-install-recommends cmake ccache libgl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdbus-1-dev libcurl4-openssl-dev zlib1g-dev xvfb xauth xdotool imagemagick dbus
          sudo apt-get autoclean $archives > /dev/null
          sudo chown -R "$USER" .apt-archives
          rm -f .apt-archives/lock
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-archives
          key: apt-desktop-${{ github.sha }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-desktop-${{ github.sha }}
          restore-keys: ccache-desktop-
      # Only what this build used goes back to the cache (a hit refreshes an
      # object's date): one build's objects, about 25 MB, not 400 MB of builds
      # gone by.
      - name: Build (desktop simulation)
        run: |
          start=$(date +%s)
          make desktop CMAKE_ARGS=-DPLAYGUARD_WERROR=ON
          ccache --show-stats
          ccache --evict-older-than "$(( $(date +%s) - start + 60 ))s"
          tar -cf desktop-build.tar build-desktop/playguard build-desktop/resources
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-desktop-${{ github.sha }}
      # A tar keeps the program executable (an artifact's zip does not). Named
      # after the run, not the attempt: a shard re-run on its own finds it;
      # a re-run of this job replaces it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-build-${{ github.run_id }}
          path: desktop-build.tar
          overwrite: true
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  # Clicks through every screen of that build headlessly: catches borealis
  # XML / view errors without a console. The scenarios run in parallel
  # shards of about the same length, under 3 minutes each under software GL
  # (the default tour is split in two, `smoke` and `games`; the text check in
  # three, five languages each). The desktop-smoke job below gathers them
  # under one name for the release job and branch rules.
  desktop-smoke-shard:
    name: desktop-smoke (${{ matrix.shard }})
    needs: [ meta, desktop-build ]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: default
            scenarios: smoke
          - shard: games
            scenarios: games
          # The other scenarios in three shards of about 170 s each, by their
          # times on a runner (s): cadran 125, gate 93, devbuild 79, outside 62,
          # forwarders 40 (locally; to check on a runner), library 27, update
          # 25, errors 23, sysnotes 22, the others 15 or less.
          - shard: cadran
            scenarios: cadran rescue cadranlarge cadranunlocked forged lock loading
          - shard: states
            scenarios: gate outside alarm cadranstates rollback
          - shard: developer
            scenarios: devbuild library update errors sysnotes forwarders
          # The remote link against a real broker (Mosquitto), a simulated agent
          # sysmodule, and the optional modules.
          - shard: link
            scenarios: sync agent modules
            packages: mosquitto mosquitto-clients
          # Every Cadran tab in the 15 languages, normal and larger text: no
          # text cut short (tools/cut_text_check.py, tests/cut_text/), five
          # languages a shard (about 3 minutes each).
          - shard: languages-1
            scenarios: cuttext
            languages: en-US fr fr-CA de es
          - shard: languages-2
            scenarios: cuttext
            languages: es-419 it nl pt pt-BR
          - shard: languages-3
            scenarios: cuttext
            languages: ru ja ko zh-Hans zh-Hant
    env:
      ARTIFACT: playguard-${{ needs.meta.outputs.label }}-screenshots-${{ matrix.shard }}
    steps:
      # The program comes built; borealis for the font the visual check
      # draws the footer's clock with (tools/visual_check.py), not its GLFW.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-build-${{ github.run_id }}
      - name: The desktop build
        run: tar -xf desktop-build.tar && rm desktop-build.tar && test -x build-desktop/playguard
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-archives
          key: apt-desktop-${{ github.sha }}
          restore-keys: apt-desktop-
      # desktop-build's list but the compilers' tools, from its package cache
      # (the libraries the program links come with their -dev packages):
      # xauth is what xvfb-run needs, libgl1-mesa-dri is llvmpipe
      # (LIBGL_ALWAYS_SOFTWARE=1), dbus the session the app's portals ask for.
      - name: Dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          archives="-o Dir::Cache::Archives=$GITHUB_WORKSPACE/.apt-archives"
          mkdir -p .apt-archives/partial
          sudo apt-get update
          sudo apt-get install $archives -y --no-install-recommends libgl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            libdbus-1-dev libcurl4-openssl-dev zlib1g-dev xvfb xauth xdotool imagemagick dbus \
            ${{ matrix.packages }}
      # Each scenario writes its screenshots (and a contact sheet of them) to
      # smoke/ (the default one) or smoke-<scenario>/. Every scenario of the
      # shard runs; the step fails at the end if one did. smoke-results.tsv
      # (scenario, result, seconds, screens) feeds the summary.
      - name: Smoke test (${{ matrix.scenarios }} ${{ matrix.languages }})
        env:
          SCENARIOS: ${{ matrix.scenarios }}
          LANGUAGES: ${{ matrix.languages }}
        run: |
          failed=""
          for sc in $SCENARIOS; do
            if [ "$sc" = smoke ]; then out=smoke; arg=""; else out="smoke-$sc"; arg="$sc"; fi
            echo "::group::$sc"
            start=$SECONDS
            if [ "$sc" = cuttext ]; then cmd="tools/cut_text_check.py $out $LANGUAGES"; else cmd="tools/desktop_smoke.py $out $arg"; fi
            if xvfb-run -s "-screen 0 1280x720x24" python3 $cmd; then result=ok; else result=fail; failed="$failed $sc"; fi
            screens=$(ls "$out"/*.png 2>/dev/null | grep -vc contact-sheet || true)
            printf '%s\t%s\t%s\t%s\n' "$sc" "$result" "$((SECONDS - start))" "$screens" >> smoke-results.tsv
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error title=Smoke test::failed:$failed"; exit 1; fi
      # The screens against tests/visual/<scenario> (reference | now | changes
      # in smoke*/visual_diff/ when one changed; tests/visual/README.md says
      # how to update the references after a change that is meant). The
      # simulator draws the focus without its moving glow
      # (PLAYGUARD_SIM_STILL_FOCUS), so a screen comes out the same in every
      # run: one that changed fails the job, with the side-by-side images in
      # the shard's screenshots artifact and the details in the job summary
      # (visual-results.tsv: scenario, result, screens compared, the changed
      # ones, the check's output).
      - name: Visual check
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          failed=""
          for sc in $SCENARIOS; do
            if [ "$sc" = smoke ]; then out=smoke; else out="smoke-$sc"; fi
            if [ ! -d "tests/visual/$sc" ]; then   # no references for this scenario
              printf '%s\tnone\t0\t\t\n' "$sc" >> visual-results.tsv
              continue
            fi
            if python3 tools/visual_check.py "$out" "tests/visual/$sc" > "$out-visual.txt" 2>&1; then
              tail -n 1 "$out-visual.txt"
              printf '%s\tok\t%s\t\t\n' "$sc" "$(grep -c '^ok   \|^FAIL ' "$out-visual.txt" || true)" >> visual-results.tsv
            else
              cat "$out-visual.txt"
              summary=$(grep '^visual check:' "$out-visual.txt" || echo "visual check failed")
              echo "::error title=Visual check ($sc)::$summary — see the $ARTIFACT artifact (visual_diff/)"
              changed=$(sed -n 's/^visual check: [0-9]* screen(s) changed: //p' "$out-visual.txt" | tr -d ' ')
              printf '%s\tchanged\t%s\t%s\t%s\n' "$sc" "$(grep -c '^ok   \|^FAIL ' "$out-visual.txt" || true)" "$changed" "$out-visual.txt" >> visual-results.tsv
              failed="$failed $sc"
            fi
          done
          [ -z "$failed" ]
      - name: Upload screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            smoke*/*.png
            smoke*/app.log
            smoke*/*.txt
            smoke*/mosquitto.log
            smoke*/visual_diff/*.png
          retention-days: 14
      - name: Shard summary
        if: always()
        env:
          SCENARIOS: ${{ matrix.scenarios }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          python3 tools/ci_summary.py smoke --shard "${{ matrix.shard }}" --scenarios $SCENARIOS \
            --results smoke-results.tsv --visual visual-results.tsv --artifact "$ARTIFACT" --artifact-url "$ARTIFACT_URL" \
            >> "$GITHUB_STEP_SUMMARY"

  # One result for the shards above, under the name the release job and the
  # branch rules wait for.
  # Its shards skipped as a whole when the pull request does not need them
  # (`changes`).
  desktop-smoke:
    if: ${{ !cancelled() }}
    needs: [ changes, desktop-smoke-shard ]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          NEEDED: ${{ needs.changes.outputs.desktop }}
          RESULT: ${{ needs.desktop-smoke-shard.result }}
        run: test "$RESULT" = success || { test "$NEEDED" = false && test "$RESULT" = skipped; }

  # The real .nro, built in the official devkitPro image, and compat.json
  # (what the app's update check reads from the latest release).
  # The image is pinned by digest so a release can be rebuilt with the same
  # toolchain. The `image:` line below is the only place the digest is
  # written: "Build identity", ./run.sh and toolchain-watch.yml read it from
  # this file. To move to a newer devkitPro, replace it (from
  # `docker buildx imagetools inspect devkitpro/devkita64:latest`; the monthly
  # toolchain-watch.yml opens an issue when the image moved); the job then
  # checks that its libnx is still recent enough.
  # The image is pulled before any step runs, and Docker Hub's anonymous limit
  # (per runner IP, shared with every other job on it) can refuse it. With the
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets (a read-only access token)
  # the pull is made logged in; where secrets are missing (a fork's pull request,
  # Dependabot) it pulls anonymously as before. The workflow rejects an empty
  # username or password, so without both secrets credentials is an empty
  # mapping, and the runner skips the login when it has no username.
  # The image has no bash: the steps are POSIX sh.
  switch:
    needs: [ meta, changes ]
    if: needs.changes.outputs.switch == 'true'
    runs-on: ubuntu-26.04
    # A release builds twice from scratch (no ccache, below): longer.
    timeout-minutes: ${{ inputs.tag && 45 || 20 }}
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
      credentials: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.DOCKERHUB_USERNAME), toJSON(secrets.DOCKERHUB_TOKEN))) || fromJSON('{}') }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 400M
      LABEL: ${{ needs.meta.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: ccache
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache
      - name: Compiler messages as annotations
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"
      # Not for a release: its two builds compile everything, so the
      # reproducibility check below compares two real compilations, not
      # objects both builds took from main's cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.tag }}
        with:
          path: .ccache
          key: ccache-switch-${{ github.sha }}
          restore-keys: ccache-switch-
      - name: Build .nro / .zip
        env:
          # The commit the app says it was built from (app::commit()): for a
          # pull request its head, as the artifacts API names the run, not the
          # merge commit checked out. Developer › Install another build
          # tells the installed build by it.
          PLAYGUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # A release (a vX.Y.Z tag, from release-please.yml): the header's
          # version badge shows it as stable; every other build as a development one.
          PLAYGUARD_RELEASE: ${{ inputs.tag && '1' || '0' }}
          # The reproducibility check (below) on main, a release, a schedule
          # or a run by hand: on a pull request the second build takes every
          # object from the first's ccache, which proves little for a minute
          # or two of the run.
          REPRO: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          # The checkout belongs to another user than the container's root: git
          # refuses it without this, and CMake reads the commit the app shows.
          git config --global --add safe.directory '*'
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          # A release: no cache at all, the second build below included (it
          # would take every object from the first).
          if [ "$PLAYGUARD_RELEASE" = 1 ]; then export CCACHE_DISABLE=1; fi
          ccache --zero-stats > /dev/null
          start=$(date +%s)
          # PlayGuard's warnings as errors, as on the desktop: the libnx code
          # (source/core/*.c, the __SWITCH__ paths) is only built here.
          make dist CMAKE_ARGS=-DPLAYGUARD_WERROR=ON
          # make dist builds the optional sysmodules first and bundles them in
          # the romfs (Console › Optional modules); each is also its own asset
          # (sysmodule/rescue/, sysmodule/agent/).
          make dist-rescue dist-agent
          # This build's hit rate, for the summary (the second build below hits every time).
          ccache --print-stats > ccache-stats.txt
          ccache --show-stats
          # The same commit gives the same zips (CONTRIBUTING.md, "Reproducible
          # zips"): build them once more and compare. What each build packed
          # is kept (the zips, the .nro, its NACP, the shaders, the checksum
          # of every RomFS file): tools/repro_diff.py says what differs, down
          # to the RomFS file, and a failed check uploads both builds.
          keep() {
            mkdir -p "$1/dksh"
            cp playguard.zip playguard-rescue.zip playguard-agent.zip build/playguard.nro build/playguard.nacp "$1/"
            cp build/dksh/*.dksh "$1/dksh/"
            (cd build/resources && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$1/resources.sha256"
          }
          if [ "$REPRO" = 1 ]; then
            keep repro/first
            make dist CMAKE_ARGS=-DPLAYGUARD_WERROR=ON
            make dist-rescue dist-agent
            keep repro/second
            if ! python3 tools/repro_diff.py repro/first repro/second; then
              echo "::error title=Reproducible zips::the second build differs from the first (what differs is above; both builds are in the repro-diff artifact)"
              exit 1
            fi
          fi
          # The raw sysmodules next to their zips, for their artifacts.
          cp sysmodule/rescue/out/playguard-rescue.nsp playguard-rescue.nsp
          cp sysmodule/agent/out/playguard-agent.nsp playguard-agent.nsp
          # Only what these builds used goes back to the cache (a hit refreshes
          # an object's date), not 350 MB of builds gone by.
          ccache --evict-older-than "$(( $(date +%s) - start + 60 ))s"
      - name: Both builds, when they differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playguard-${{ env.LABEL }}-repro-diff
          path: repro/
          retention-days: 7
          if-no-files-found: ignore
      - name: Toolchain
        run: |
          dkp-pacman -Q devkitA64 libnx deko3d switch-tools switch-curl > toolchain.txt
          cat toolchain.txt
          # libnx 4.11.0 and 4.11.1 break recursive mutexes (newlib's stdio
          # and malloc locks), fixed in 4.12.0; before 4.10.0 the thread-local
          # storage clashes with 21.0.0 and later.
          libnx=$(sed -n 's/^libnx //p' toolchain.txt)
          if [ "$(printf '%s\n' 4.12.0 "${libnx%-*}" | sort -V | head -n 1)" != 4.12.0 ]; then
            echo "::error title=Toolchain::libnx $libnx is older than 4.12.0"
            exit 1
          fi
          # libnx's 21.0.0 marker (LNY2 after MOD0), which hbmenu checks.
          python3 tools/check_nro.py playguard.nro sysmodule/rescue/out/playguard-rescue.elf sysmodule/agent/out/playguard-agent.elf
      - name: compat.json
        run: python3 tools/gen_compat.py . compat.json
      - name: Build identity
        run: |
          # actions/checkout marks the workspace safe only in a temporary HOME
          # during its own step; the checkout belongs to another user than the
          # container's root, so git refuses it here without this.
          git config --global --add safe.directory '*'
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "image: $(sed -n 's/^ *image: \(devkitpro\/devkita64@sha256:[0-9a-f]*\)$/\1/p' .github/workflows/build.yml)"
            git submodule status
            cat toolchain.txt
          } > build-info.txt
          sha256sum playguard.nro playguard.zip playguard-rescue.zip playguard-agent.zip compat.json > SHA256SUMS.txt
          cat build-info.txt
          unzip -l playguard.zip
          unzip -l playguard-rescue.zip
          unzip -l playguard-agent.zip
      # One artifact per component, named after the build (playguard-<label>-…):
      # -nro is what Developer › Install another build downloads on the
      # console (source/util/dev_builds.hpp: the raw .nro and the small text
      # files only, never the zip too); -rescue the recovery sysmodule, as the
      # zip the release attaches (SD-card layout) and the raw .nsp; -agent the
      # remote link's sysmodule, the same way; -sdcard the
      # store zip, only on a release build (the release job attaches it; a
      # pull request's .nro is enough to try); -linker-map what makes the .nro big.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: nro
        with:
          name: playguard-${{ env.LABEL }}-nro
          path: |
            playguard.nro
            compat.json
            build-info.txt
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: rescue
        with:
          name: playguard-${{ env.LABEL }}-rescue
          path: |
            playguard-rescue.zip
            playguard-rescue.nsp
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: agent
        with:
          name: playguard-${{ env.LABEL }}-agent
          path: |
            playguard-agent.zip
            playguard-agent.nsp
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: sdcard
        if: inputs.tag != ''
        with:
          name: playguard-${{ env.LABEL }}-sdcard
          path: playguard.zip
          compression-level: 0   # a zip already
          if-no-files-found: error
      - name: Linker map (what makes the .nro big)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: map
        with:
          name: playguard-${{ env.LABEL }}-linker-map
          path: build/borealis.map
          retention-days: 14
          if-no-files-found: error
      # The .nro size of main's last build (a small JSON in the Actions cache,
      # written by the pushes to main below) for the "vs main" column.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: baseline-nro
          key: baseline-nro-main-${{ github.sha }}
          restore-keys: baseline-nro-main-
      - name: Build summary
        env:
          NRO_URL: ${{ steps.nro.outputs.artifact-url }}
          RESCUE_URL: ${{ steps.rescue.outputs.artifact-url }}
          AGENT_URL: ${{ steps.agent.outputs.artifact-url }}
          SDCARD_URL: ${{ steps.sdcard.outputs.artifact-url }}
          MAP_URL: ${{ steps.map.outputs.artifact-url }}
        run: |
          set -- --artifact "playguard-$LABEL-nro|$NRO_URL|playguard.nro · compat.json · build-info.txt · SHA256SUMS.txt — what the console's *Install another build* downloads" \
                 --artifact "playguard-$LABEL-rescue|$RESCUE_URL|playguard-rescue.zip (unzip at the SD-card root) · playguard-rescue.nsp" \
                 --artifact "playguard-$LABEL-agent|$AGENT_URL|playguard-agent.zip (unzip at the SD-card root) · playguard-agent.nsp"
          if [ -n "$SDCARD_URL" ]; then set -- "$@" --artifact "playguard-$LABEL-sdcard|$SDCARD_URL|playguard.zip (the store package: unzip at the SD-card root)"; fi
          set -- "$@" --artifact "playguard-$LABEL-linker-map|$MAP_URL|borealis.map (14 days)"
          python3 tools/ci_summary.py build --version "${{ needs.meta.outputs.version }}" --ref "${{ needs.meta.outputs.ref }}" \
            --sha "${{ needs.meta.outputs.sha }}" --ccache ccache-stats.txt --gcc "$(/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc -dumpfullversion)" \
            --map build/borealis.map --baseline baseline-nro/size.json --write-baseline baseline-nro/size.json "$@" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.tag == ''
        with:
          path: baseline-nro
          key: baseline-nro-main-${{ github.sha }}

  # Only when called by release-please.yml: check the NACP version matches the
  # tag, then attach the assets to the release. The raw .nro is what sphaira's
  # GitHub updater downloads; the .zip is what the Homebrew App Store
  # (hb-appstore) picks up; compat.json is what PlayGuard's update check reads
  # (releases/latest/download/compat.json); build-info.txt names the commit,
  # the submodules and the toolchain the assets were built with.
  release:
    if: inputs.tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [ meta, host-tests, host-tests-clang-coverage, switch, desktop-smoke ]
    permissions:
      contents: write
      # Build provenance (below): a signed statement, kept by GitHub, that these files
      # were built by this workflow from this commit.
      id-token: write
      attestations: write
      # The release's discussion (tools/release_page.sh).
      discussions: write
    env:
      LABEL: ${{ needs.meta.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(sed -n 's/^set(VERSION_\(MAJOR\|MINOR\|ALTER\) "\([0-9]*\)").*/\2/p' CMakeLists.txt | paste -sd.)
          test "v$v" = "$TAG" || { echo "tag $TAG != CMake version $v"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playguard-${{ env.LABEL }}-nro
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playguard-${{ env.LABEL }}-rescue
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playguard-${{ env.LABEL }}-agent
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playguard-${{ env.LABEL }}-sdcard
          path: dist
      # Anyone can then check that a download came from this repository's CI, unchanged:
      #   gh attestation verify playguard.nro -R JigSawFr/PlayGuard
      # SHA256SUMS.txt says the files match each other; this says who built them.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/playguard.nro
            dist/playguard.zip
            dist/playguard-rescue.zip
            dist/playguard-agent.zip
            dist/compat.json
      # The release exists (release-please created it with the tag): the
      # assets are added to it. --clobber: a re-run replaces its own files.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" --clobber dist/playguard.nro dist/playguard.zip dist/playguard-rescue.zip \
            dist/playguard-agent.zip dist/compat.json dist/build-info.txt dist/SHA256SUMS.txt
      # The release page laid out (tools/release_page.sh): "PlayGuard X.Y.Z",
      # a summary, the figures, the commit list release-please wrote folded
      # (what users notice, what contributors do), the screens that changed,
      # the install section, this run's report, and a discussion. The summary is the hand-written one
      # (.github/release-notes/<version>.md, see its README), else, with the
      # OPENROUTER_API_KEY secret set, one written by a language model
      # (tools/summarize_release.py; the OPENROUTER_MODEL variable picks the
      # model). Read from the commit this run is for (main), not the tag: a
      # summary merged after the release pull request still counts when the
      # release is created later (a re-run of release-please after a failed
      # one). A missing summary never fails the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
          sparse-checkout: |
            .github/release-notes
            resources/img/emoji
            tools/release_notes.py
            tools/release_page.sh
            tools/summarize_release.py
          sparse-checkout-cone-mode: false
      # A token of the "PlayGuard Release" app, for the release's discussion:
      # the app published the release, so it is the discussion's author, and
      # GITHUB_TOKEN cannot edit another author's post. Optional: without it
      # (or without the app's Discussions permission) the post is left as is.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          # The app's client ID (or, until RELEASE_APP_CLIENT_ID is set, its app ID:
          # GitHub takes either as the JWT's issuer); "app-id" is deprecated.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Release page
        working-directory: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          RELEASE_DISCUSSION_CATEGORY: ${{ vars.RELEASE_DISCUSSION_CATEGORY }}
          DISCUSSION_TOKEN: ${{ steps.app-token.outputs.token }}
        run: tools/release_page.sh "$TAG" --apply
      - name: Release summary
        env:
          TAG: ${{ inputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 tools/ci_summary.py release --tag "$TAG" --repo-url "$REPO_URL" --dir dist >> "$GITHUB_STEP_SUMMARY"
