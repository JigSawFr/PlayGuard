name: pages

# Publishes PlayGuard's website on GitHub Pages (site/README.md), with GitHub
# Actions as its source (Settings › Pages › Source: GitHub Actions): main's
# `site` artifact (web.yml) at the root, and each open pull request's in
# pr-<number>/, with its link in a comment on the pull request (which says
# the preview is gone once the pull request is closed).
#
# It runs where main's workflows run (workflow_run, pull_request_target), so
# the github-pages environment, which deploys from main only, takes it; it
# checks out nothing and runs nothing of a pull request: it only puts the
# files web.yml built in place. Pull requests from forks are left out (their
# pages would be served from this site). Each run publishes everything again,
# so a closed pull request's preview goes at the next one.
on:
  workflow_run:
    workflows: [ web ]
    types: [ completed ]
  pull_request_target:
    types: [ closed ]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; the newest waiting one publishes everything.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Each release's simulator, kept with the release (an artifact lasts 30
  # days): the one web.yml built for the release's commit on main, attached
  # as playguard-simulator.zip to the latest releases that have none yet
  # (from 1.3.0 on: 1.2.0 had no simulator), then published below in
  # simulator/<tag>/, which the simulator offers beside main's.
  release-simulator:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write   # the release's asset
      actions: read     # web.yml's artifacts
    steps:
      - name: The simulator attached to the releases that have none
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="repos/$REPO/actions/workflows/web.yml/runs"
          for tag in $(gh release list -R "$REPO" --limit 3 --exclude-drafts --json tagName --jq '.[].tagName'); do
            if gh release view "$tag" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx playguard-simulator.zip; then
              continue
            fi
            sha=$(gh api "repos/$REPO/commits/$tag" --jq .sha)
            run=$(gh api -X GET "$runs" -f head_sha="$sha" -f event=push -f status=success \
                    --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$REPO\")][0].id // empty")
            if [ -z "$run" ]; then echo "$tag: no web build of ${sha::7}"; continue; fi
            rm -rf build playguard-simulator.zip
            if ! gh run download "$run" -R "$REPO" -n site -D build || [ ! -f build/simulator/playguard.wasm ]; then
              echo "$tag: no simulator in web run $run (gone after 30 days, or none built)"
              continue
            fi
            (cd build/simulator && rm -rf shots && zip -qr ../../playguard-simulator.zip .)
            gh release upload "$tag" playguard-simulator.zip -R "$REPO"
            echo "$tag: its simulator attached (web run $run)" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    needs: release-simulator
    # A web build that failed changes nothing; the job above may be skipped.
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read          # the artifacts of web.yml's runs
      pages: write
      id-token: write
      pull-requests: write   # the link on the pull request
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: main's site, and each open pull request's in pr-<number>/
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="repos/$REPO/actions/workflows/web.yml/runs"
          mkdir site
          # Runs are listed by branch name alone, whatever repository they
          # come from: a fork can name a branch as one of ours (main, or an
          # open pull request's) and its pull request's web run would come up
          # too. Only runs of this repository are taken.
          ours=".workflow_runs | map(select(.head_repository.full_name == \"$REPO\")) | .[0].id // empty"
          main=$(gh api -X GET "$runs" -f branch=main -f event=push -f status=success -f per_page=20 --jq "$ours")
          if [ -n "$main" ]; then
            gh run download "$main" -R "$REPO" -n site -D site
            echo "main: run $main" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The simulator as the documentation: simulator/ is the latest
          # release's (main's while no release has one), simulator/dev/ main's,
          # simulator/<tag>/ each release's (the job above), its header naming
          # the release; their list for the simulator's Version
          # (simulator/releases.json, the newest first). main's screenshots
          # stay in simulator/shots/, which pull requests compare with.
          if [ -d site/simulator ]; then
            mv site/simulator main-simulator
            mkdir -p site/simulator
            cp -r main-simulator site/simulator/dev
            rm -rf site/simulator/dev/shots
            releases='[]'
            latest=""
            for tag in $(gh release list -R "$REPO" --limit 20 --exclude-drafts --json tagName --jq '.[].tagName'); do
              gh release download "$tag" -R "$REPO" -p playguard-simulator.zip -D "release-$tag" 2>/dev/null || continue
              mkdir -p "site/simulator/$tag"
              unzip -q "release-$tag/playguard-simulator.zip" -d "site/simulator/$tag"
              if [ -f "site/simulator/$tag/build.json" ]; then
                jq --arg tag "$tag" '.ref = $tag | .pr = null' "site/simulator/$tag/build.json" > build.json
                mv build.json "site/simulator/$tag/build.json"
              fi
              latest=${latest:-$tag}
              releases=$(jq -c --arg tag "$tag" '. + [{tag: $tag}]' <<< "$releases")
              echo "simulator/$tag: its release's" >> "$GITHUB_STEP_SUMMARY"
            done
            # simulator/ itself: the latest release's files, else main's.
            src=main-simulator
            if [ -n "$latest" ]; then src="site/simulator/$latest"; fi
            for f in "$src"/*; do
              if [ "$(basename "$f")" != shots ]; then cp -r "$f" site/simulator/; fi
            done
            echo "simulator/: ${latest:-main}" >> "$GITHUB_STEP_SUMMARY"
            if [ -d main-simulator/shots ]; then cp -r main-simulator/shots site/simulator/shots; fi
            echo "$releases" > site/simulator/releases.json
          fi
          previews=""
          # A pull request's newest successful build: the one before its last
          # push while that one builds, so its preview stays up meanwhile.
          for pr in $(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
                        --jq ".[] | select(.head.repo.full_name == \"$REPO\") | \"\(.number):\(.head.ref)\""); do
            number=${pr%%:*}
            branch=${pr#*:}
            run=$(gh api -X GET "$runs" -f branch="$branch" -f event=pull_request -f status=success -f per_page=20 \
                    --jq "$ours")
            [ -n "$run" ] || continue
            gh run download "$run" -R "$REPO" -n site -D "site/pr-$number"
            previews="$previews $number"
            echo "pr-$number: run $run" >> "$GITHUB_STEP_SUMMARY"
          done
          touch site/.nojekyll
          echo "previews=$previews" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The pull request whose build started this run: its comment points to
      # its preview (one comment, edited at each push).
      - name: Link on the pull request
        if: >-
          github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SITE: ${{ steps.deploy.outputs.page_url }}
          PREVIEWS: ${{ steps.gather.outputs.previews }}
        run: |
          set -euo pipefail
          pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')
          [ -n "$pr" ] && [[ " $PREVIEWS " == *" $pr "* ]] || exit 0
          url="${SITE%/}/pr-$pr/"
          sim="${url}simulator/"
          shots="${sim}shots/"
          # The screens against main's (web.yml's shots/compare.json).
          compare="site/pr-$pr/simulator/shots/compare.json"
          changes=""
          if [ -f "$compare" ]; then
            n=$(jq '.changed | length' "$compare")
            total=$(jq '.compared' "$compare")
            if [ "$n" -gt 0 ]; then
              changes="**Screens changed against main** ($n of $total, main | this pull request | the changes): $(jq -r --arg d "${shots}visual_diff/" '.changed | map("[\(.)](\($d)\(.).png)") | join(" · ")' "$compare")"
            else
              changes="Screens against main: the $total compared are unchanged."
            fi
          fi
          marker='<!-- playguard-web-simulator -->'
          body=$(cat <<EOF
          $marker
          ### 🕹️ Preview of this pull request

          **[The web simulator](${sim})** · [the website](${url}) — commit \`${SHA::7}\`, updated at each push (allow a minute for GitHub Pages).

          Straight to a state: [unlocked](${sim}?unlocked=1) · [limit reached](${sim}?restricted=1) · [no PIN yet](${sim}?not_set_up=1) · [updates to install](${sim}?fw=22.5.0&latest=1.1.0:24.0.0&sys_latest=1.12.1:6.5.4:23.0.1:1.6.3.0&sys_notes=sample&dev_builds=sample&github_login=ok&hbloader=1) · [in French, dark](${sim}?lang=fr&theme=dark). The side panel sets the rest, **Copy link** gives a link to what it shows, and the buttons under the screen move the console's time on.

          ${changes}

          <details><summary>The screens of this build (web smoke test)</summary>

          | Today | Play timer | Activity |
          |---|---|---|
          | <img src="${shots}overview.png?v=${SHA::7}" width="300" alt="Today"> | <img src="${shots}play_timer.png?v=${SHA::7}" width="300" alt="Play timer"> | <img src="${shots}activity.png?v=${SHA::7}" width="300" alt="Activity"> |
          | **Console** | **Limit reached** | **Japanese** |
          | <img src="${shots}console.png?v=${SHA::7}" width="300" alt="Console"> | <img src="${shots}limit_reached.png?v=${SHA::7}" width="300" alt="Limit reached"> | <img src="${shots}japanese.png?v=${SHA::7}" width="300" alt="Japanese"> |

          </details>

          <sub>Keyboard: arrows, Enter (A), Esc (B), X, Y, L, R, ⇧L (ZL), ⇧R (ZR), + and −; a click is a touch; an on-screen pad on phones. See [web/README.md](https://github.com/${REPO}/blob/${SHA}/web/README.md). The preview goes when the pull request is closed.</sub>
          EOF
          )
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
                 --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" > /dev/null
          fi
          echo "[pr-$pr]($sim)" >> "$GITHUB_STEP_SUMMARY"
      # The pull request just closed: its preview is gone with this
      # deployment, so its comment no longer links to it (nor to its screens).
      - name: Comment of the closed pull request
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SITE: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          marker='<!-- playguard-web-simulator -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty" | head -n 1)
          [ -n "$id" ] || exit 0
          if [ "$MERGED" = true ]; then
            what="Merged: its changes are in [main's simulator](${SITE%/}/simulator/dev/) once main's build is published."
          else
            what="Closed without merging."
          fi
          body=$(cat <<EOF
          $marker
          ### 🕹️ Preview of this pull request

          No longer online (last commit \`${SHA::7}\`): the preview goes when the pull request is closed. ${what}
          EOF
          )
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          echo "pr-$PR: its comment updated (closed)" >> "$GITHUB_STEP_SUMMARY"
