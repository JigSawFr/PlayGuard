name: web

# PlayGuard's website (site/README.md) with the web simulator in it
# (web/README.md), built for main and for each pull request into one artifact,
# `site`: the home page and the documentation in the console's 15 languages,
# their screenshots taken in each language from the simulator, and the
# simulator in simulator/. pages.yml publishes them on GitHub Pages:
# main's at the root, each open pull request's in pr-<number>/.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the build of the commit it replaces.
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Emscripten, pinned: a new one is a pull request of its own (its ports, its
  # threads and its file packager can change).
  EMSDK_VERSION: 6.0.12
  # The emsdk tool itself, at that version's tag, checked against the commit
  # the tag pointed to when pinned: a tag can be moved, a commit cannot.
  EMSDK_COMMIT: 35ff8a6d150541276abbc6bae512ca90bcfbe220
  # Playwright, pinned, for the simulator's smoke test (Python) and the
  # website's screenshots (Node): one version, one Chromium for both.
  PLAYWRIGHT_VERSION: 1.64.0

jobs:
  build:
    runs-on: ubuntu-26.04
    # main takes every screenshot in both themes and renders the tours (below): longer.
    timeout-minutes: ${{ github.event_name == 'push' && 120 || 60 }}
    permissions:
      contents: read
      pages: read   # the site's address (its custom domain)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Emscripten's cache: its system libraries and ports (SDL2, zlib), built
      # for threads and exceptions on first use, which takes minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.emscripten_cache
          key: emscripten-${{ env.EMSDK_VERSION }}
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT" \
            || { echo "::error::emsdk's $EMSDK_VERSION tag is not $EMSDK_COMMIT any more"; exit 1; }
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      # Japanese, Korean and Chinese in the simulator: a CJK font cut out of
      # Noto Sans CJK with fontTools (tools/web_cjk_font.py); the website's
      # documentation is Markdown (tools/build_site.py).
      - name: Noto Sans CJK, fontTools and Python-Markdown
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk python3-fonttools python3-markdown imagemagick
      - name: The simulator
        env:
          PLAYGUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # After emsdk_env.sh, which unsets EM_CACHE (emsdk.py's
          # construct_env_with_vars()): set before, the ports were built in
          # emsdk's own folder and the cache above stayed empty.
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export EM_CACHE="$HOME/.emscripten_cache"
          make web JOBS="$(nproc)"
          test -f build-web/simulator/cjk.otf || { echo "::error::no CJK font in the web build"; exit 1; }
      # The simulator in headless Chromium (tools/web_smoke.py): it must reach
      # its first screen in each kind of start, move the time on and take a
      # live setting without a restart, add the CJK font, keep its state with
      # keep=1. Its screens go with the site, for the pull request's comment
      # (pages.yml). Playwright, pinned, in a venv of its own.
      # A few minutes when it works: one that hangs (a browser that stopped
      # answering) fails here rather than at the job's timeout, its log
      # unbuffered so that it says where.
      - name: The simulator in a browser
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/playwright/bin/python" -u tools/web_smoke.py build-web/simulator build-web/shots
      # The site's address, as GitHub Pages serves it: its custom domain when
      # it has one (Settings › Pages), else <owner>.github.io/<repo>/; a pull
      # request's preview in pr-<number>/. The pages' absolute links
      # (canonical, other languages, sitemap, llms.txt) are that address, and
      # 404.html, served at any path, starts its links from its path. A
      # preview is kept out of search engines. MAIN_SITE: main's, published.
      - name: The site's address
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # https when Pages enforces it, whatever html_url says meanwhile.
          pages=$(gh api "repos/$REPO/pages" \
                    --jq 'if .https_enforced then (.html_url | sub("^http:"; "https:")) else .html_url end' 2>/dev/null || true)
          owner="${REPO%%/*}"
          pages="${pages:-https://${owner,,}.github.io/${REPO#*/}/}"
          pages="${pages%/}/"
          {
            echo "MAIN_SITE=$pages"
            echo "SITE_URL=$pages${PR:+pr-$PR/}"
            echo "SITE_BASE=/${pages#*://*/}${PR:+pr-$PR/}"
            echo "SITE_NOINDEX=${PR:+1}"
          } | tee -a "$GITHUB_ENV"
      # The website's screenshots, each screen in each language and in both
      # themes (tools/site_screenshots.mjs): the simulator just built, in the
      # Chromium the step above installed. A pull request that changes nothing
      # the screens are made of (the app, its resources, the simulator, the
      # version) takes main's published ones instead, in seconds; one that
      # does takes the light theme's (about half an hour) and main's dark
      # ones, which main takes again once merged. Then the preview image of
      # each language (tools/site_social.mjs). Nothing of Playwright goes
      # into the site.
      - name: The screenshots in each language
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          if [ -n "$BASE_SHA" ]; then
            git fetch -q --depth=1 origin "$BASE_SHA"
            screens='^(source|resources|web|extern|patches)/|^(CMakeLists\.txt|Makefile|\.release-please-manifest\.json|tools/site_screenshots\.mjs)$'
            if ! git diff --name-only "$BASE_SHA" HEAD | grep -qE "$screens"; then
              echo "Nothing the screens are made of changed: main's screenshots."
              export SITE_SCREENSHOTS_FROM="$MAIN_SITE"
            fi
          fi
          npx playwright install chromium
          version=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')
          if [ -n "$BASE_SHA" ] && [ -z "${SITE_SCREENSHOTS_FROM:-}" ]; then
            SITE_SCREENSHOT_THEMES=light SITE_SCREENSHOT_JOBS="$(nproc)" node tools/site_screenshots.mjs build-web/simulator shots "$version"
            SITE_SCREENSHOTS_FROM="$MAIN_SITE" SITE_SCREENSHOT_THEMES=dark node tools/site_screenshots.mjs build-web/simulator shots
          else
            SITE_SCREENSHOT_JOBS="$(nproc)" node tools/site_screenshots.mjs build-web/simulator shots "$version"
          fi
          node tools/site_social.mjs shots
      # The home page's tour in each language but English (branding/tour.html
      # over the language's screenshots, tools/render_tour.mjs): main renders
      # them, a pull request takes main's (one missing there: the English tour).
      - name: The tour in each language
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = true ]; then
            for lang in fr fr-CA de es es-419 it nl pt pt-BR ru ja ko zh-Hans zh-Hant; do
              curl -sfL -o "shots/$lang/tour.mp4" "${MAIN_SITE}assets/images/screenshots/$lang/tour.mp4" || rm -f "shots/$lang/tour.mp4"
            done
          else
            sudo apt-get install -y -q --no-install-recommends ffmpeg
            TOUR_JOBS="$(nproc)" node tools/render_tour.mjs shots
          fi
          ls shots/*/tour.mp4 2>/dev/null | wc -l | xargs -I{} echo "{} tours"
      # The screens against main's, published with its site: which ones this
      # pull request changes (tools/visual_check.py, the footer clock masked;
      # side by side in shots/visual_diff/), for its comment (pages.yml,
      # shots/compare.json) and the run's summary. A report, not a gate: a
      # change can be meant. A screen main does not have yet is left out.
      - name: The screens against main's
        if: github.event_name == 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          main="https://${OWNER,,}.github.io/$NAME/simulator/shots/"
          mkdir -p build-web/main-shots
          for f in build-web/shots/*.png; do
            n=$(basename "$f")
            curl -sfL -o "build-web/main-shots/$n" "$main$n" || rm -f "build-web/main-shots/$n"
          done
          if ! ls build-web/main-shots/*.png > /dev/null 2>&1; then
            echo "No screens on main's site yet: nothing to compare."
            exit 0
          fi
          python3 tools/visual_check.py build-web/shots build-web/main-shots > build-web/compare.txt 2>&1 || true
          cat build-web/compare.txt
          python3 - <<'EOF'
          import json, os, re
          lines = open("build-web/compare.txt").read().splitlines()
          compared = [l for l in lines if re.match(r"(ok   |FAIL )", l)]
          changed = [re.match(r"FAIL (\w+)", l).group(1) for l in compared if l.startswith("FAIL ")]
          json.dump({"base": "main", "compared": len(compared), "changed": changed},
                    open("build-web/shots/compare.json", "w"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### The web simulator's screens against main's\n\n")
              f.write(f"{len(changed)} of {len(compared)} changed" + (": " + ", ".join(changed) if changed else "") + "\n\n")
          EOF
      - name: The website, the simulator in it
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # SITE_URL, SITE_BASE, SITE_NOINDEX: the site's address (above).
          export SITE_SCREENSHOTS=shots
          python3 tools/build_site.py out .
          # Every link of the site to the site, and every #anchor (a heading
          # renamed, a translation's anchors), must lead somewhere.
          python3 tools/check_site_links.py out "$SITE_URL"
          cp -r build-web/simulator out/simulator
          cp -r build-web/shots out/simulator/shots
          python3 - <<'EOF'
          import json, os
          build = {k.lower(): os.environ[k] for k in ("REPO", "SHA", "REF", "TITLE")}
          build["pr"] = int(os.environ["PR"]) if os.environ["PR"] else None
          with open("out/simulator/build.json", "w") as f:
              json.dump(build, f)
          EOF
          {
            echo "### Website and web simulator"
            echo
            echo "$(find out -name index.html | wc -l) pages, $(find out/assets/images/screenshots -name '*.webp' | wc -l) screenshots of the console in its languages, $(du -sh out | cut -f1) in all."
            echo
            echo "| Simulator file | Size | gzip |"
            echo "|---|---|---|"
            for f in out/simulator/playguard.wasm out/simulator/playguard.data out/simulator/playguard.js out/simulator/cjk.otf; do
              echo "| \`$(basename "$f")\` | $(( $(stat -c %s "$f") / 1024 )) KiB | $(( $(gzip -9c "$f" | wc -c) / 1024 )) KiB |"
            done
            echo
            echo "Starts in headless Chromium (s, page load to first screen, tools/web_smoke.py):"
            echo
            echo '```'
            cat build-web/shots/timings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          include-hidden-files: true   # .nojekyll
          retention-days: 30
