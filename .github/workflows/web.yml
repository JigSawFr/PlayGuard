name: web

# PlayGuard's website (site/README.md) with the web simulator in it
# (web/README.md), built for main and for each pull request into one artifact,
# `site`: the home page and the documentation in the console's 15 languages,
# and the simulator in simulator/. pages.yml publishes them on GitHub Pages:
# main's at the root, each open pull request's in pr-<number>/.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the build of the commit it replaces.
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Emscripten, pinned: a new one is a pull request of its own (its ports, its
  # threads and its file packager can change).
  EMSDK_VERSION: 6.0.12
  # The emsdk tool itself, at that version's tag, checked against the commit
  # the tag pointed to when pinned: a tag can be moved, a commit cannot.
  EMSDK_COMMIT: 35ff8a6d150541276abbc6bae512ca90bcfbe220

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Emscripten's cache: its system libraries and ports (SDL2, zlib), built
      # for threads and exceptions on first use, which takes minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.emscripten_cache
          key: emscripten-${{ env.EMSDK_VERSION }}
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT" \
            || { echo "::error::emsdk's $EMSDK_VERSION tag is not $EMSDK_COMMIT any more"; exit 1; }
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      # Japanese, Korean and Chinese in the simulator: a CJK font cut out of
      # Noto Sans CJK with fontTools (tools/web_cjk_font.py); the website's
      # documentation is Markdown (tools/build_site.py).
      - name: Noto Sans CJK, fontTools and Python-Markdown
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk python3-fonttools python3-markdown imagemagick
      - name: The simulator
        env:
          PLAYGUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export EM_CACHE="$HOME/.emscripten_cache"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make web JOBS="$(nproc)"
          test -f build-web/simulator/cjk.otf || { echo "::error::no CJK font in the web build"; exit 1; }
      # The simulator in headless Chromium (tools/web_smoke.py): it must reach
      # its first screen in each kind of start, move the time on and take a
      # live setting without a restart, add the CJK font, keep its state with
      # keep=1. Its screens go with the site, for the pull request's comment
      # (pages.yml). Playwright, pinned, in a venv of its own.
      - name: The simulator in a browser
        env:
          PLAYWRIGHT_VERSION: 1.64.0
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/playwright/bin/python" tools/web_smoke.py build-web/simulator build-web/shots
      # The screens against main's, published with its site: which ones this
      # pull request changes (tools/visual_check.py, the footer clock masked;
      # side by side in shots/visual_diff/), for its comment (pages.yml,
      # shots/compare.json) and the run's summary. A report, not a gate: a
      # change can be meant. A screen main does not have yet is left out.
      - name: The screens against main's
        if: github.event_name == 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          main="https://${OWNER,,}.github.io/$NAME/simulator/shots/"
          mkdir -p build-web/main-shots
          for f in build-web/shots/*.png; do
            n=$(basename "$f")
            curl -sfL -o "build-web/main-shots/$n" "$main$n" || rm -f "build-web/main-shots/$n"
          done
          if ! ls build-web/main-shots/*.png > /dev/null 2>&1; then
            echo "No screens on main's site yet: nothing to compare."
            exit 0
          fi
          python3 tools/visual_check.py build-web/shots build-web/main-shots > build-web/compare.txt 2>&1 || true
          cat build-web/compare.txt
          python3 - <<'EOF'
          import json, os, re
          lines = open("build-web/compare.txt").read().splitlines()
          compared = [l for l in lines if re.match(r"(ok   |FAIL )", l)]
          changed = [re.match(r"FAIL (\w+)", l).group(1) for l in compared if l.startswith("FAIL ")]
          json.dump({"base": "main", "compared": len(compared), "changed": changed},
                    open("build-web/shots/compare.json", "w"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### The web simulator's screens against main's\n\n")
              f.write(f"{len(changed)} of {len(compared)} changed" + (": " + ", ".join(changed) if changed else "") + "\n\n")
          EOF
      - name: The website, the simulator in it
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # GitHub Pages serves 404.html at any path: its links start from the
          # site's root, a pull request's folder for its preview.
          export SITE_BASE="/${REPO#*/}/${PR:+pr-$PR/}"
          python3 tools/build_site.py out .
          cp -r build-web/simulator out/simulator
          cp -r build-web/shots out/simulator/shots
          python3 - <<'EOF'
          import json, os
          build = {k.lower(): os.environ[k] for k in ("REPO", "SHA", "REF", "TITLE")}
          build["pr"] = int(os.environ["PR"]) if os.environ["PR"] else None
          with open("out/simulator/build.json", "w") as f:
              json.dump(build, f)
          EOF
          {
            echo "### Website and web simulator"
            echo
            echo "$(find out -name index.html | wc -l) pages, $(du -sh out | cut -f1) in all."
            echo
            echo "| Simulator file | Size | gzip |"
            echo "|---|---|---|"
            for f in out/simulator/playguard.wasm out/simulator/playguard.data out/simulator/playguard.js out/simulator/cjk.otf; do
              echo "| \`$(basename "$f")\` | $(( $(stat -c %s "$f") / 1024 )) KiB | $(( $(gzip -9c "$f" | wc -c) / 1024 )) KiB |"
            done
            echo
            echo "Starts in headless Chromium (s, page load to first screen, tools/web_smoke.py):"
            echo
            echo '```'
            cat build-web/shots/timings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          include-hidden-files: true   # .nojekyll
          retention-days: 30
