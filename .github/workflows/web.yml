name: web

# The web simulator (web/README.md): the desktop simulator built with
# Emscripten, published on GitHub Pages from the gh-pages branch. main's at the
# site's root, each pull request's in pr-<number>/, with its link in a comment
# on the pull request (updated at each push), and removed when it is closed.
# GitHub Pages must serve the gh-pages branch (Settings › Pages › Deploy from a
# branch › gh-pages, / (root)), once the first run has created it.
#
# gh-pages holds a single commit, pushed again at each deployment: the
# previews are rebuilt at every push, so their history would only pile up
# megabytes of .wasm.
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the build of the commit it replaces.
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Emscripten, pinned: a new one is a pull request of its own (its ports, its
  # threads and its file packager can change).
  EMSDK_VERSION: 6.0.12

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Emscripten's cache: its system libraries and ports (SDL2, zlib), built
      # for threads and exceptions on first use, which takes minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.emscripten_cache
          key: emscripten-${{ env.EMSDK_VERSION }}
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build
        env:
          PLAYGUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export EM_CACHE="$HOME/.emscripten_cache"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make web JOBS="$(nproc)"
      - name: What was built (build.json, read by the page)
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'EOF'
          import json, os
          build = {k.lower(): os.environ[k] for k in ("REPO", "SHA", "REF", "TITLE")}
          build["pr"] = int(os.environ["PR"]) if os.environ["PR"] else None
          with open("build-web/site/build.json", "w") as f:
              json.dump(build, f)
          EOF
          ls -la build-web/site
          {
            echo "### Web simulator"
            echo
            echo "| File | Size | gzip |"
            echo "|---|---|---|"
            for f in build-web/site/playguard.wasm build-web/site/playguard.data build-web/site/playguard.js; do
              echo "| \`$(basename "$f")\` | $(( $(stat -c %s "$f") / 1024 )) KiB | $(( $(gzip -9c "$f" | wc -c) / 1024 )) KiB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-simulator
          path: build-web/site
          retention-days: 7

  # Not for a pull request from a fork (its token cannot write here), and by
  # hand only from main (the site's root is main's).
  deploy:
    needs: build
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # One deployment at a time: each one pushes the whole branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-simulator
          path: site
      - name: Publish on gh-pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dir=${PR:+pr-$PR}
          publish() {   # publish <message>: the tree in pages/ as gh-pages' only commit
            git -C pages add -A
            tree=$(git -C pages write-tree)
            commit=$(git -C pages commit-tree "$tree" -m "$1")
            git -C pages push --force origin "$commit:refs/heads/gh-pages"
          }
          git init -q pages
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C pages fetch -q --depth 1 origin gh-pages; then git -C pages checkout -q FETCH_HEAD; fi
          touch pages/.nojekyll
          if [ -n "$dir" ]; then
            rm -rf "pages/$dir"
            cp -r site "pages/$dir"
          else
            # main at the root: everything but the pull requests' folders goes.
            find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll ! -name 'pr-*' -exec rm -rf {} +
            cp -r site/. pages/
          fi
          publish "web simulator: ${dir:-main} at ${SHA::7}"
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "url=https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/${dir:+$dir/}" >> "$GITHUB_OUTPUT"
      - name: Link on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.publish.outputs.url }}
        run: |
          marker='<!-- playguard-web-simulator -->'
          body=$(cat <<EOF
          $marker
          ### 🕹️ Web simulator

          **[Open this pull request's build in the browser]($URL)** — commit \`${SHA::7}\`, updated at each push (allow a minute for GitHub Pages).

          Straight to a state: [unlocked](${URL}?unlocked=1) · [limit reached](${URL}?restricted=1) · [no PIN yet](${URL}?not_set_up=1) · [in French, dark](${URL}?lang=fr&theme=dark). The side panel sets the rest, and **Copy link** gives a link to what it shows.

          <sub>Keyboard: arrows, Enter (A), Esc (B), X, Y, L, R, ⇧L (ZL), ⇧R (ZR), + and −; a click is a touch; an on-screen pad on phones. See [web/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${SHA}/web/README.md).</sub>
          EOF
          )
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

  # A closed pull request's folder goes, and its comment says so.
  remove:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Remove pr-${{ github.event.pull_request.number }}/ from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git init -q pages
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C pages fetch -q --depth 1 origin gh-pages || exit 0
          git -C pages checkout -q FETCH_HEAD
          [ -d "pages/pr-$PR" ] || exit 0
          rm -rf "pages/pr-$PR"
          git -C pages add -A
          tree=$(git -C pages write-tree)
          commit=$(git -C pages commit-tree "$tree" -m "web simulator: pr-$PR removed")
          git -C pages push --force origin "$commit:refs/heads/gh-pages"
          marker='<!-- playguard-web-simulator -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty" | head -n 1)
          [ -z "$id" ] || gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
            -f body="$marker"$'\n'"### 🕹️ Web simulator"$'\n\n'"Removed with the pull request's closing." > /dev/null
