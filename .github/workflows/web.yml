name: web

# PlayGuard's website (site/README.md) with the web simulator in it
# (web/README.md), built for main and for each pull request into one artifact,
# `site`: the home page and the documentation in the console's 15 languages,
# their screenshots taken in each language from the simulator, and the
# simulator in simulator/. pages.yml publishes them on GitHub Pages:
# main's at the root, each open pull request's in pr-<number>/.
on:
  push:
    branches: [ main ]
  pull_request:
  # The merge queue (build.yml says why): the site built once more on top of
  # main, its links checked, nothing published (pages.yml leaves it out).
  merge_group:
  # By hand (Actions › web › Run workflow): `all` builds the simulator, takes
  # every screenshot and renders every tour again, whatever changed.
  workflow_dispatch:
    inputs:
      screens:
        description: "auto (what changed, a release) or all (everything again)"
        type: choice
        options: [ auto, all ]
        default: auto

permissions:
  contents: read

# A new push to a pull request cancels the build of the commit it replaces; the
# merge queue's runs, one group each, are cancelled by the queue itself.
# main's builds run one at a time, in order: each starts from the last one's
# site (below), a release's screenshots too.
concurrency:
  group: web-${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  # Emscripten, pinned: a new one is a pull request of its own (its ports, its
  # threads and its file packager can change).
  EMSDK_VERSION: 6.0.12
  # The emsdk tool itself, at that version's tag, checked against the commit
  # the tag pointed to when pinned: a tag can be moved, a commit cannot.
  EMSDK_COMMIT: 35ff8a6d150541276abbc6bae512ca90bcfbe220
  # Playwright, pinned, for the simulator's smoke test (Python) and the
  # website's screenshots (Node): one version, one Chromium for both.
  PLAYWRIGHT_VERSION: 1.64.0
  # axe-core, for the website's accessibility (tools/site_layout.py): its
  # npm package, checked against the hash it had when pinned.
  AXE_VERSION: 4.13.0
  AXE_SHA256: 096912f6e77b4b695fc9304b7be65091db42d98de054da674ae222a11cb33f70

jobs:
  build:
    runs-on: ubuntu-26.04
    # Taking every screenshot in both themes and rendering the tours (a
    # release, or by hand): about three hours, four languages at a time,
    # 38 minutes each four (2026-10-24: 120 minutes stopped it at 8 of 15).
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 30 || 300 }}
    outputs:
      release: ${{ steps.what.outputs.release }}
    permissions:
      contents: read
      pages: read     # the site's address (its custom domain)
      actions: read   # main's last site, to take what did not change from it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # The history and the tags, without old files' contents (fetched
          # when read): the site's documentation of the latest release, out
          # of its tag, and what main has since (tools/build_site.py).
          fetch-depth: 0
          filter: blob:none
      # What this build makes, and what it takes from main's last one (its
      # `site` artifact): a few minutes for most changes, the long work only
      # where it is needed.
      # - The simulator (Emscripten, then its smoke test in Chromium, about
      #   ten minutes): built when what it is made of changed since the commit
      #   main's last site was built from: the app, its resources, the
      #   simulator, this workflow.
      #   Otherwise main's, its smoke test's screens with it.
      # - The website's screenshots (both themes, every language, about three
      #   hours) and the tours and preview images made from them: taken by
      #   hand (`all`); otherwise main's published ones, in seconds. A release
      #   (main, its version changed: the header's badge) is published first
      #   with main's, in minutes, then this workflow runs again with `all`
      #   (the release-screens job below) and publishes its own.
      # The website itself is built every time (seconds); its layout on a
      # phone, a tablet and a desktop is checked for a pull request that
      # changes what it is made of (about half a minute, below).
      - name: What to build
        id: what
        env:
          FORCE: ${{ inputs.screens == 'all' }}
          # The merge queue as a pull request: a release pull request in it
          # does not take every screenshot again (main does, once merged).
          IS_PR: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Main's last site: a run of main's own (pushed or by hand) in this
          # repository, never a fork's pull request from a branch it named main.
          read -r run sha < <(gh api "repos/$REPO/actions/workflows/web.yml/runs?branch=main&status=success&per_page=20" \
            --jq "([.workflow_runs[] | select((.event == \"push\" or .event == \"workflow_dispatch\") and .head_repository.full_name == \"$REPO\")][0] // empty) | \"\(.id) \(.head_sha)\"" 2>/dev/null || true)
          if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n site -D main-site 2>/dev/null \
              && { git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch -q origin "$sha" 2>/dev/null; }; then
            # (The whole history is here: --depth would cut it at that commit,
            # and the site would no longer reach the latest release's tag.)
            # What changed since the commit it was built from.
            changed=$(git diff --name-only "$sha" HEAD)
            echo "Main's site: run $run, commit ${sha::7}; $(wc -l <<< "$changed") files changed since."
          else
            # None (an artifact lasts 30 days): the simulator built, the
            # screenshots from the published site (below).
            echo "::warning::No site of main's to start from."
            changed=all-but-screens
          fi
          [ "$FORCE" = true ] && changed=all
          simulator='^(source|resources|web|extern)/|^(CMakeLists\.txt|Makefile|\.release-please-manifest\.json|\.github/workflows/web\.yml)$|^tools/web_'
          site='^(site|docs|images|branding)/|^resources/i18n/|^tools/(build_site|site_layout|check_site_links)\.py$|^CHANGELOG\.md$|^\.github/workflows/web\.yml$'
          build=0; screens=0; layout=0; release=0
          if [[ "$changed" == all* ]] || grep -qE "$simulator" <<< "$changed"; then build=1; fi
          if [[ "$changed" == all* ]] || grep -qE "$site" <<< "$changed"; then layout=1; fi
          if [ "$changed" = all ]; then screens=1; fi
          # A release: its version (the header's badge) changed, on main. Its
          # site goes out now with main's screenshots; its own are taken by
          # the run the release-screens job starts.
          if [ "$changed" != all ] && [ "$IS_PR" != true ] && grep -qx '\.release-please-manifest\.json' <<< "$changed"; then release=1; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "BUILD_SIMULATOR=$build"
            echo "TAKE_SCREENS=$screens"
            echo "CHECK_LAYOUT=$layout"
          } | tee -a "$GITHUB_ENV"
      # Emscripten's cache: its system libraries and ports (SDL2, zlib), built
      # for threads and exceptions on first use, which takes minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.BUILD_SIMULATOR == '1'
        with:
          path: ~/.emscripten_cache
          key: emscripten-${{ env.EMSDK_VERSION }}
      # The compiler's own cache (ccache): the files a change leaves alone
      # are not compiled again. Main's, saved by main's builds only (below):
      # a pull request's would only serve itself and push main's out of the
      # repository's 10 GB.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.BUILD_SIMULATOR == '1'
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ env.EMSDK_VERSION }}-${{ github.sha }}
          restore-keys: ccache-web-${{ env.EMSDK_VERSION }}-
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        if: env.BUILD_SIMULATOR == '1'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT" \
            || { echo "::error::emsdk's $EMSDK_VERSION tag is not $EMSDK_COMMIT any more"; exit 1; }
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      # Japanese, Korean and Chinese in the simulator: a CJK font cut out of
      # Noto Sans CJK with fontTools (tools/web_cjk_font.py); the website's
      # documentation is Markdown (tools/build_site.py).
      # The packages as downloaded by main's last build (68 MB, the CJK font
      # 61 MB of it): an Ubuntu mirror served them at 78 kB/s once, 14 minutes
      # of the run (2026-10-22). apt takes them from there and fetches only
      # what moved since; main's builds save them (build.yml says why only
      # main's).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-archives
          key: apt-web-${{ github.sha }}
          restore-keys: apt-web-
      # Then Chromium's system libraries and fonts for Playwright (its
      # install-deps, 25 MB the mirror served at 38 kB/s once: 11 minutes,
      # 2026-10-23), here so that main's cache holds them too: wherever the
      # simulator's smoke test, the layout check or the screenshots run, and
      # on main to keep them in the cache. The browser itself comes from
      # Playwright's CDN, in seconds. Every apt-get of the job goes through
      # that folder, dpkg without fsync on a runner thrown away.
      - name: Noto Sans CJK, fontTools, Python-Markdown and Chromium's libraries
        run: |
          printf 'Dir::Cache::Archives "%s/.apt-archives";\nDpkg::Options { "--force-unsafe-io"; };\n' "$GITHUB_WORKSPACE" \
            | sudo tee /etc/apt/apt.conf.d/90-ci-archives > /dev/null
          mkdir -p .apt-archives/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk python3-fonttools python3-markdown imagemagick ccache
          if [ "$GITHUB_REF" = refs/heads/main ] || [ "$BUILD_SIMULATOR$CHECK_LAYOUT$TAKE_SCREENS" != 000 ]; then
            python3 -m venv "$RUNNER_TEMP/playwright"
            "$RUNNER_TEMP/playwright/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
            sudo "$RUNNER_TEMP/playwright/bin/python" -m playwright install-deps chromium
          fi
          sudo apt-get autoclean > /dev/null
          sudo chown -R "$USER" .apt-archives
          rm -f .apt-archives/lock
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: .apt-archives
          key: apt-web-${{ github.sha }}
      - name: The simulator
        if: env.BUILD_SIMULATOR == '1'
        env:
          PLAYGUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # Its pull request's number (app::pr()), empty for any other build.
          PLAYGUARD_PR: ${{ github.event.pull_request.number }}
        run: |
          # After emsdk_env.sh, which unsets EM_CACHE (emsdk.py's
          # construct_env_with_vars()): set before, the ports were built in
          # emsdk's own folder and the cache above stayed empty.
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export EM_CACHE="$HOME/.emscripten_cache"
          make web JOBS="$(nproc)" CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          ccache --show-stats || true
          test -f build-web/simulator/cjk.otf || { echo "::error::no CJK font in the web build"; exit 1; }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.BUILD_SIMULATOR == '1' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ env.EMSDK_VERSION }}-${{ github.sha }}
      # The simulator in headless Chromium (tools/web_smoke.py): it must reach
      # its first screen in each kind of start, move the time on and take a
      # live setting without a restart, add the CJK font, keep its state with
      # keep=1. Its screens go with the site, for the pull request's comment
      # (pages.yml). Playwright, pinned, in a venv of its own; its system
      # libraries installed above.
      # About a minute, its scenarios a few at once: one that hangs (a browser
      # that stopped answering) is stopped and fails, rather than the job's
      # timeout, its log unbuffered so that it says where.
      - name: The simulator in a browser
        if: env.BUILD_SIMULATOR == '1'
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/playwright/bin/python" -u tools/web_smoke.py build-web/simulator build-web/shots
      # Main's simulator and its smoke test's screens, when this build does
      # not make its own.
      - name: Main's simulator
        if: env.BUILD_SIMULATOR != '1'
        run: |
          mkdir -p build-web
          cp -r main-site/simulator build-web/simulator
          mv build-web/simulator/shots build-web/shots
          rm -rf build-web/simulator/build.json build-web/shots/compare.json build-web/shots/visual_diff
      # The site's address, as GitHub Pages serves it: its custom domain when
      # it has one (Settings › Pages), else <owner>.github.io/<repo>/; a pull
      # request's preview in pr-<number>/. The pages' absolute links
      # (canonical, other languages, sitemap, llms.txt) are that address, and
      # 404.html, served at any path, starts its links from its path. A
      # preview is kept out of search engines. MAIN_SITE: main's, published.
      - name: The site's address
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # https when Pages enforces it, whatever html_url says meanwhile.
          pages=$(gh api "repos/$REPO/pages" \
                    --jq 'if .https_enforced then (.html_url | sub("^http:"; "https:")) else .html_url end' 2>/dev/null || true)
          owner="${REPO%%/*}"
          pages="${pages:-https://${owner,,}.github.io/${REPO#*/}/}"
          pages="${pages%/}/"
          {
            echo "MAIN_SITE=$pages"
            echo "SITE_URL=$pages${PR:+pr-$PR/}"
            echo "SITE_BASE=/${pages#*://*/}${PR:+pr-$PR/}"
            echo "SITE_NOINDEX=${PR:+1}"
          } | tee -a "$GITHUB_ENV"
      # The website's screenshots, each screen in each language and in both
      # themes (tools/site_screenshots.mjs), from the simulator just built in
      # the Chromium the step above installed; the preview image of each
      # language (tools/site_social.mjs) and the home page's tour in each
      # language but English (tools/render_tour.mjs) made from them. For a
      # release, or by hand (above); otherwise main's, as published. Nothing
      # of Playwright goes into the site.
      - name: The screenshots, preview images and tours in each language
        if: env.TAKE_SCREENS == '1'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install chromium
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          version=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')
          SITE_SCREENSHOT_JOBS="$(nproc)" node tools/site_screenshots.mjs build-web/simulator shots "$version"
          node tools/site_social.mjs shots
          TOUR_JOBS="$(nproc)" node tools/render_tour.mjs shots
      - name: Main's screenshots, preview images and tours
        if: env.TAKE_SCREENS != '1'
        env:
          RELEASE: ${{ steps.what.outputs.release }}
        run: |
          mkdir -p shots
          if [ -d main-site/assets/images/screenshots ]; then
            cp -r main-site/assets/images/screenshots/. shots/
            # build_site.py's own English images are in the repository.
            find shots -maxdepth 1 -type f -delete
          else
            # No artifact of main's: the published site's screenshots and tours.
            npm install --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
            SITE_SCREENSHOTS_FROM="$MAIN_SITE" node tools/site_screenshots.mjs build-web/simulator shots
            for lang in fr fr-CA de es es-419 it nl pt pt-BR ru ja ko zh-Hans zh-Hant; do
              [ -d "shots/$lang" ] || continue
              for f in tour.mp4 social.png; do
                curl -sfL -o "shots/$lang/$f" "${MAIN_SITE}assets/images/screenshots/$lang/$f" || rm -f "shots/$lang/$f"
              done
            done
          fi
          # A release: its English pages show the repository's screenshots
          # (images/screenshots/, taken for the release, the README's) rather
          # than main's of the previous release, until the release-screens
          # run takes them all; the other languages keep main's meanwhile.
          if [ "$RELEASE" = 1 ]; then rm -rf shots/en-US; echo "A release: the repository's English screenshots."; fi
          echo "$(find shots -type f | wc -l) files from main's site"
      # The screens against main's, published with its site: which ones this
      # pull request changes (tools/visual_check.py, the footer clock masked;
      # side by side in shots/visual_diff/), for its comment (pages.yml,
      # shots/compare.json) and the run's summary. A report, not a gate: a
      # change can be meant. A screen main does not have yet is left out.
      - name: The screens against main's
        if: github.event_name == 'pull_request' && env.BUILD_SIMULATOR == '1'
        run: |
          # MAIN_SITE: main's published site (the site's address, above).
          main="${MAIN_SITE}simulator/shots/"
          mkdir -p build-web/main-shots
          for f in build-web/shots/*.png; do
            n=$(basename "$f")
            curl -sfL -o "build-web/main-shots/$n" "$main$n" || rm -f "build-web/main-shots/$n"
          done
          if ! ls build-web/main-shots/*.png > /dev/null 2>&1; then
            echo "No screens on main's site yet: nothing to compare."
            exit 0
          fi
          python3 tools/visual_check.py build-web/shots build-web/main-shots > build-web/compare.txt 2>&1 || true
          cat build-web/compare.txt
          python3 - <<'EOF'
          import json, os, re
          lines = open("build-web/compare.txt").read().splitlines()
          compared = [l for l in lines if re.match(r"(ok   |FAIL )", l)]
          changed = [re.match(r"FAIL (\w+)", l).group(1) for l in compared if l.startswith("FAIL ")]
          json.dump({"base": "main", "compared": len(compared), "changed": changed},
                    open("build-web/shots/compare.json", "w"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### The web simulator's screens against main's\n\n")
              f.write(f"{len(changed)} of {len(compared)} changed" + (": " + ", ".join(changed) if changed else "") + "\n\n")
          EOF
      - name: The website, the simulator in it
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # SITE_URL, SITE_BASE, SITE_NOINDEX: the site's address (above).
          # SITE_SIMULATOR: what it downloads, said on its buttons.
          export SITE_SCREENSHOTS=shots SITE_SIMULATOR=build-web/simulator
          python3 tools/build_site.py out .
          # Every link of the site to the site, and every #anchor (a heading
          # renamed, a translation's anchors), must lead somewhere.
          python3 tools/check_site_links.py out "$SITE_URL"
          cp -r build-web/simulator out/simulator
          cp -r build-web/shots out/simulator/shots
          python3 - <<'EOF'
          import json, os
          build = {k.lower(): os.environ[k] for k in ("REPO", "SHA", "REF", "TITLE")}
          build["pr"] = int(os.environ["PR"]) if os.environ["PR"] else None
          with open("out/simulator/build.json", "w") as f:
              json.dump(build, f)
          EOF
          {
            echo "### Website and web simulator"
            echo
            echo "$(find out -name index.html | wc -l) pages, $(find out/assets/images/screenshots -name '*.webp' | wc -l) screenshots of the console in its languages, $(du -sh out | cut -f1) in all."
            echo
            echo "| Simulator file | Size | gzip |"
            echo "|---|---|---|"
            for f in out/simulator/playguard.wasm out/simulator/playguard.data out/simulator/playguard.js out/simulator/cjk.otf; do
              echo "| \`$(basename "$f")\` | $(( $(stat -c %s "$f") / 1024 )) KiB | $(( $(gzip -9c "$f" | wc -c) / 1024 )) KiB |"
            done
            echo
            echo "Starts in headless Chromium (s, page load to first screen, tools/web_smoke.py):"
            echo
            echo '```'
            cat build-web/shots/timings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The website's layout (tools/site_layout.py): no page wider than the
      # screen on a phone, a tablet or a desktop, no field iOS zooms into, no
      # script that throws, nothing axe finds against WCAG 2.2 AA (about 15 s
      # of it). For a pull request (or by hand) that changes the site, its
      # documentation or its texts; main has had it. In the Playwright of the
      # simulator's smoke test when this build made it, else Chromium's
      # headless shell alone.
      # Playwright and its system packages first, apart: a slow Ubuntu mirror
      # can take minutes over the fonts alone, which is not the check's time.
      # The venv can be there without a browser (the system packages' step
      # makes it for install-deps alone, the simulator not built): the headless
      # shell is installed whatever, a no-op when the smoke test's Chromium
      # brought it.
      - name: Playwright for the website's layout
        if: github.event_name != 'push' && env.CHECK_LAYOUT == '1'
        timeout-minutes: 20
        run: |
          py="$RUNNER_TEMP/playwright/bin/python"
          if [ ! -x "$py" ]; then
            python3 -m venv "$RUNNER_TEMP/playwright"
            "$RUNNER_TEMP/playwright/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
          fi
          "$py" -m playwright install --only-shell chromium
      - name: The website on a phone, a tablet and a desktop
        if: github.event_name != 'push' && env.CHECK_LAYOUT == '1'
        timeout-minutes: 5
        run: |
          py="$RUNNER_TEMP/playwright/bin/python"
          curl -sfL --retry 3 -o "$RUNNER_TEMP/axe.tgz" "https://registry.npmjs.org/axe-core/-/axe-core-$AXE_VERSION.tgz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tgz" | sha256sum -c --quiet
          # axe.min.js alone, read out of the package by Python rather than
          # tar: CodeQL takes a tar after "What to build"'s `gh run download`
          # for that artifact's extraction (its cache poisoning query), and
          # flags each step after it. That artifact is main's own (above).
          python3 -c 'import sys, tarfile; open(sys.argv[2], "wb").write(tarfile.open(sys.argv[1]).extractfile("package/axe.min.js").read())' \
            "$RUNNER_TEMP/axe.tgz" "$RUNNER_TEMP/axe.min.js"
          SITE_AXE="$RUNNER_TEMP/axe.min.js" "$py" -u tools/site_layout.py out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          include-hidden-files: true   # .nojekyll
          retention-days: 30

  # A release's screenshots, tours and preview images, once its site is out
  # (pages.yml publishes this run's as soon as it ends): this workflow again,
  # by hand's way (`all`, about three hours), which pages.yml publishes in
  # turn. GITHUB_TOKEN may start a workflow_dispatch run. It waits behind
  # this one (main's builds run one at a time) and a push meanwhile does not
  # replace it once it runs; should it fail, *Actions › web › Run workflow*,
  # `all`, takes them.
  release-screens:
    needs: build
    if: needs.build.outputs.release == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write   # the workflow_dispatch run
    steps:
      - name: Every screenshot of the release, in a run of its own
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run web.yml -R "$REPO" --ref main -f screens=all
          echo "The release's screenshots: a web run with \`all\` started, published once it ends." >> "$GITHUB_STEP_SUMMARY"
