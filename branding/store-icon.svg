<svg xmlns="http://www.w3.org/2000/svg" width="256" height="150" viewBox="0 0 256 150">
  <!-- Homebrew App Store icon (256x150): the icon on the left, the name on the right, on Aurore's night. -->
  <defs>
    <linearGradient id="st-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#141B2E"/></linearGradient>
    <linearGradient id="st-word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.55" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
  </defs>
  <rect width="256" height="150" fill="url(#st-sky)"/>
  <image href="icon.svg" x="16" y="27" width="96" height="96"/>
  <text x="184" y="68" text-anchor="middle" font-family="Sora" font-weight="700" font-size="28" letter-spacing="-0.5" fill="#E8EEF7">Play</text>
  <text x="184" y="98" text-anchor="middle" font-family="Sora" font-weight="700" font-size="28" letter-spacing="-0.5" fill="#E8EEF7">Guard</text>
  <rect x="164" y="110" width="40" height="3" rx="1.5" fill="url(#st-word)"/>
</svg>
